<!doctype html>
<!-- Ersatz für https://jinthegreat-4k.github.io/tagesplan/ (Repo JintheGreat-4k/tagesplan), erst nach Marcs Bestätigung
     des Lifehub veröffentlichen. Räumt auf diesem Gerät die alte App weg und leitet in den Lifehub weiter:
     1. meldet die Popups dieses Geräts beim Google-Skript ab (einmal mit dem alten Schlüssel, falls noch da),
     2. beendet das Popup-Abo und den Service Worker der alten App,
     3. löscht alle tagesplan.*-Einträge (darunter Adresse und Schlüssel) und die tagesplan-*-Zwischenspeicher,
     4. öffnet https://lauener.online/plan/ mit demselben Sprungziel (#aufgabe=…, #kalender=… usw.).
     Andere Seiten unter jinthegreat-4k.github.io bleiben unberührt. -->
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Marcs Tagesplan ist umgezogen</title>
<style>
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f2f4f3;color:#17201d}
  main{max-width:32rem;margin:15vh auto 0;padding:0 20px}
  h1{font-size:1.4rem;margin:0 0 .5rem}
  a{color:#1c5a78;font-weight:600}
  @media (prefers-color-scheme: dark){body{background:#0e1412;color:#e4ebe8}a{color:#8cc4de}}
</style>
</head>
<body>
<main>
  <h1>Der Tagesplan ist umgezogen</h1>
  <p id="text">Er läuft jetzt im Lauener Lifehub. Einen Moment, die alte App wird auf diesem Gerät aufgeräumt …</p>
  <p><a id="weiter" href="https://lauener.online/plan/">Zum Tagesplan im Lifehub</a></p>
</main>
<script>
(function () {
  "use strict";
  var ZIEL = "https://lauener.online/plan/";
  var URL_RE = /^https:\/\/script\.google\.com\/(?:a\/macros\/[^\/?#]+|macros)\/s\/[\w-]+\/exec$/;
  // Nur bekannte Sprungziele weitergeben (wie die Widget-App)
  var HASH_RE = /^#(heute|neu|termin|kalender(=\d{4}-\d{2}-\d{2})?|aufgabe=[\w.:@-]{1,200})$/;
  var hash = HASH_RE.test(location.hash) ? location.hash : "";
  document.getElementById("weiter").href = ZIEL + hash;

  function lesen(name) { try { return JSON.parse(localStorage.getItem(name)); } catch (e) { return null; } }
  function mitFrist(p, ms) { return Promise.race([p, new Promise(function (ok) { setTimeout(ok, ms); })]); }

  function abmelden() {
    var cfg = lesen("tagesplan.cfg"), endpoint = lesen("tagesplan.push");
    if (!cfg || typeof cfg.u !== "string" || !URL_RE.test(cfg.u) || typeof cfg.k !== "string" || typeof endpoint !== "string") return Promise.resolve();
    return fetch(cfg.u, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow", cache: "no-store",
      body: JSON.stringify({ key: cfg.k, action: "push_aus", endpoint: endpoint }) }).then(function () {}, function () {});
  }

  function workerWeg() {
    if (!("serviceWorker" in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.filter(function (r) { return String(r.scope).indexOf(location.origin + "/tagesplan/") === 0; }).map(function (r) {
        var abo = r.pushManager ? r.pushManager.getSubscription().then(function (s) { return s && s.unsubscribe(); }) : Promise.resolve();
        return abo.then(null, function () {}).then(function () { return r.unregister(); }).then(null, function () {});
      }));
    }, function () {});
  }

  function speicherWeg() {
    try {
      var weg = [];
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("tagesplan.") === 0) weg.push(k); }
      weg.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) { /* ohne Speicher nichts zu tun */ }
    if (!("caches" in window)) return Promise.resolve();
    return caches.keys().then(function (keys) {
      return Promise.all(keys.filter(function (k) { return k.indexOf("tagesplan-") === 0; }).map(function (k) { return caches.delete(k); }));
    }, function () {});
  }

  mitFrist(abmelden(), 8000)
    .then(function () { return mitFrist(workerWeg(), 5000); })
    .then(function () { return mitFrist(speicherWeg(), 5000); })
    .then(null, function () {})
    .then(function () {
      document.getElementById("text").textContent = "Er läuft jetzt im Lauener Lifehub. Die alte App ist auf diesem Gerät aufgeräumt. Du kannst ihr Symbol vom Startbildschirm entfernen.";
      location.replace(ZIEL + hash);
    });
})();
</script>
</body>
</html>
